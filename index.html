<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChromeOS Web Emulator</title>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    body {
      font-family: 'Google Sans', Roboto, sans-serif;
      background: #000;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      color: #e8eaed;
    }

    /* ChromeOS Desktop Container */
    #desktop {
      flex: 1;
      position: relative;
      background: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Scaled Screen Canvas Container */
    #screen-container {
      width: 100vw;
      height: calc(100vh - 48px);
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #screen-container canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* ChromeOS Bottom Shelf */
    #shelf {
      height: 48px;
      background: rgba(32, 33, 36, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      z-index: 1000;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .shelf-left, .shelf-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .shelf-center {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Launcher Button */
    .launcher-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .launcher-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .launcher-icon {
      width: 18px;
      height: 18px;
      border: 3px solid #e8eaed;
      border-radius: 50%;
      box-shadow: inset 0 0 0 2px transparent;
    }

    /* Pinned App Icons */
    .app-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.1s;
    }

    .app-icon:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .app-icon:active {
      transform: scale(0.92);
    }

    .app-icon img, .app-icon svg {
      width: 24px;
      height: 24px;
    }

    /* System Status Tray */
    .status-tray {
      background: rgba(255, 255, 255, 0.1);
      padding: 4px 12px;
      border-radius: 20px;
      color: #e8eaed;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      gap: 10px;
      align-items: center;
      cursor: pointer;
      transition: background 0.2s;
    }

    .status-tray:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .status-tray svg {
      fill: #e8eaed;
      width: 16px;
      height: 16px;
    }

    /* ChromeOS Launcher Popup */
    #launcher-menu {
      position: absolute;
      bottom: 60px;
      left: 12px;
      width: 360px;
      height: 450px;
      background: rgba(32, 33, 36, 0.85);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-radius: 24px;
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 16px 32px rgba(0,0,0,0.5);
      z-index: 999;
      transform: translateY(20px);
      opacity: 0;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    #launcher-menu.active {
      display: flex;
      transform: translateY(0);
      opacity: 1;
    }

    .search-bar-container {
      position: relative;
      width: 100%;
    }

    .search-bar {
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid transparent;
      outline: none;
      padding: 12px 16px 12px 42px;
      border-radius: 24px;
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      transition: background 0.2s, border 0.2s;
    }

    .search-bar:focus {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      fill: #9aa0a6;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 8px 0;
      overflow-y: auto;
    }

    .grid-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: #e8eaed;
      font-size: 12px;
      font-weight: 400;
      cursor: pointer;
      padding: 10px 4px;
      border-radius: 12px;
      transition: background 0.2s;
    }

    .grid-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .grid-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <div id="desktop">
    <div id="screen-container"></div>

    <!-- ChromeOS Launcher Popup -->
    <div id="launcher-menu">
      <div class="search-bar-container">
        <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" class="search-bar" placeholder="Search your device, apps, web...">
      </div>
      <div class="app-grid">
        <div class="grid-item">
          <div class="grid-icon" style="background: #ea4335; color: #fff;">FF</div>
          <span>Firefox ESR</span>
        </div>
        <div class="grid-item">
          <div class="grid-icon" style="background: #34a853; color: #fff;">AO</div>
          <span>App Outlet</span>
        </div>
        <div class="grid-item">
          <div class="grid-icon" style="background: #fbbc05; color: #000;">WN</div>
          <span>Wine</span>
        </div>
        <div class="grid-item">
          <div class="grid-icon" style="background: #1a73e8; color: #fff;">TERM</div>
          <span>Terminal</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ChromeOS Shelf -->
  <div id="shelf">
    <div class="shelf-left">
      <button class="launcher-btn" id="launcher-toggle" title="Launcher">
        <div class="launcher-icon"></div>
      </button>
    </div>

    <div class="shelf-center">
      <button class="app-icon" title="Browser">
        <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M12 2A10 10 0 0 0 2 12a10 10 0 0 0 10 10 10 10 0 0 0 10-10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16z"/><circle fill="#EA4335" cx="12" cy="12" r="4"/></svg>
      </button>
      <button class="app-icon" title="Terminal">
        <svg viewBox="0 0 24 24"><path fill="#34A853" d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V6h16v12z"/><path fill="#FFF" d="M7.5 15l-1.4-1.4L8.7 12 6.1 9.4 7.5 8l4 4zm4.5 0h6v-2h-6v2z"/></svg>
      </button>
    </div>

    <div class="shelf-right">
      <div class="status-tray">
        <svg viewBox="0 0 24 24"><path d="M12 3C7.95 3 4.21 4.34 1.2 6.6L12 19.8 22.8 6.6C19.79 4.34 16.05 3 12 3z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
        <span id="clock">12:00 PM</span>
      </div>
    </div>
  </div>

  <script src="libv86.js"></script>
  <script>
    // Launcher Menu Toggle
    const launcherToggle = document.getElementById('launcher-toggle');
    const launcherMenu = document.getElementById('launcher-menu');
    
    launcherToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      launcherMenu.classList.toggle('active');
    });

    document.addEventListener('click', (e) => {
      if (!launcherMenu.contains(e.target) && !launcherToggle.contains(e.target)) {
        launcherMenu.classList.remove('active');
      }
    });

    // System Clock
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Preserve original v86 initialization config
    const EmulatorConstructor = window.V86Starter || window.V86 || window.Starter;

    if (!EmulatorConstructor) {
      console.error("v86 constructor could not be found in libv86.js");
    } else {
      const emulator = new EmulatorConstructor({
        wasm_path: "v86.wasm",
        memory_size: 1024 * 1024 * 1024,
        vga_memory_size: 16 * 1024 * 1024,
        screen_container: document.getElementById("screen-container"),
        bios: { url: "seabios.bin" },
        vga_bios: { url: "vgabios.bin" },
        cdrom: {
          url: "chromeos-v86.iso",
          async: false
        },
        net_device: {
          type: "virtio",
          relay_url: "wss://relay.widgetry.org/"
        },
        autostart: true
      });
    }
  </script>
</body>
</html>
